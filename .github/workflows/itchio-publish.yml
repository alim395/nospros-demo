name: Publish to Itch.io

on:
  pull_request:
    branches: ["master"]
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.12)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'v'))
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure Git LFS files are present
        run: |
          git lfs install --local
          git lfs pull

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Godot Export
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          relative_project_path: ./
          cache: true
          archive_output: true
          presets_to_export: 'win, linux, web, macos'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create Release
        uses: ncipollo/release-action@v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          tag: ${{ steps.version.outputs.tag }}
          artifacts: ${{ steps.export.outputs.archive_directory }}/*
          allowUpdates: true
          removeArtifacts: true

      - name: Publish to Itch
        uses: Ayowel/butler-to-itch@v1.2.0
        with:
          butler_key: ${{ secrets.ITCHIO_TOKEN }}
          itch_user: ZenkoZGames
          itch_game: nospros-demo
          version: ${{ steps.version.outputs.tag }}
          files: "${{ steps.export.outputs.archive_directory }}/*"
