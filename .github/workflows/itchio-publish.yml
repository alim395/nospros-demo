name: Publish to Itch.io

on:
  pull_request:
    branches: ["master"]
    types: [closed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'v')
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure Git LFS files are present
        run: |
          git lfs install --local
          git lfs pull

      - name: Godot Export
        id: export
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          relative_project_path: ./
          cache: true
          archive_output: true
          presets_to_export: 'win, linux, web, macos'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Itch
        uses: Ayowel/butler-to-itch@v1.2.0
        with:
          butler_key: ${{ secrets.ITCHIO_TOKEN }}
          itch_user: ZenkoZGames
          itch_game: nospros-demo
          version: ${{ github.event.pull_request.head.ref }}
          files: "${{ steps.export.outputs.archive_directory }}/*"

      - name: Create Release
        uses: ncipollo/release-action@v1.18.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          tag: ${{ github.event.pull_request.head.ref }}
          artifacts: ${{ steps.export.outputs.archive_directory }}/*